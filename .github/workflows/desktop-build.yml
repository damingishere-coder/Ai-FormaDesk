name: macOS installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Ai-FormaDesk-macOS-arm64
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14
