name: Build and tests
on:
  push:
    branches: [main, 'codex/desktop-v1-release']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
