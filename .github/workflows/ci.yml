name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    env:
      FORMA_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run test:browser:safety
      - run: npm audit --omit=dev --audit-level=high
